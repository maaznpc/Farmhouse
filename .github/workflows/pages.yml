name: Deploy farmhouse planner to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "dist/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate calculations and editing controls
        run: node --test tests/*.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload planner
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy planner
        id: deployment
        uses: actions/deploy-pages@v4
